<header class="header">

  <div class="header-left">
    <h3 class="page-title">Panel Administrativo</h3>
  </div>

  <div class="header-right">

    <button class="icon-btn">🌙</button>

    <div class="profile" (click)="toggleProfile()">

      <span class="username">
        {{ user?.nombre || 'Usuario' }}
      </span>

      <span class="chevron" [class.active]="isOpen">
        ▼
      </span>
    </div>

    <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
      ⤴
    </button>

  </div>

</header>

<app-profile-modal
  *ngIf="showModal"
  [user]="user"
  (close)="closeModal()"
  (userUpdated)="updateUser($event)">
</app-profile-modal>

<app-logout-modal
  *ngIf="showLogoutModal"
  (confirm)="confirmLogout()"
  (close)="closeLogoutModal()">
</app-logout-modal>
