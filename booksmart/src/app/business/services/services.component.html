<div class="container">

  <div class="header">

    <h2>Servicios</h2>

    <div class="header-actions">

      <input 
        type="text"
        placeholder="Buscar servicio o establecimiento..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
        class="search-input"
      />

      <button class="add-btn" (click)="openCreateModal()">
        + Agregar Servicio
      </button>

    </div>

  </div>

  <div *ngIf="loading">
    <p>Cargando servicios...</p>
  </div>

  <div *ngIf="!loading && filteredServices.length === 0">
    <p>No se encontraron resultados</p>
  </div>

  <table *ngIf="filteredServices.length > 0" class="table">

    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Duración</th>
        <th>Establecimiento</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let service of filteredServices">

        <td>{{ service.nombre }}</td>
        <td>{{ service.descripcion }}</td>
        <td>{{ service.precio }}</td>
        <td>{{ service.duracion }} min</td>
        <td>{{ service.establecimiento_nombre }}</td>

        <td class="actions">

          <button class="edit-btn" (click)="editService(service)">
            ✎
          </button>

          <button class="delete-btn" (click)="openDeleteModal(service.servicio_id)">
            🗑
          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>

<app-create-service
  *ngIf="showCreateModal"
  (close)="closeCreateModal()"
  (created)="reloadAfterCreate()">
</app-create-service>

<app-edit-service
  *ngIf="showModal"
  [serviceId]="selectedId"
  (close)="closeModal()"
  (updated)="reloadAfterUpdate()">
</app-edit-service>

<app-delete-service
  *ngIf="showDeleteModal"
  [serviceId]="selectedId"
  (close)="closeDeleteModal()"
  (deleted)="reloadAfterDelete()">
</app-delete-service>
