<div class="modal" (click)="closeModal()">

  <div class="modal-content" (click)="$event.stopPropagation()">

    <h2>Agregar Servicio</h2>

    <form (ngSubmit)="createService()">

      <div class="form-group">
        <label>Establecimiento</label>
        <select [(ngModel)]="service.establecimiento_id"
                name="establecimiento_id"
                required>

          <option value="">Seleccione un establecimiento</option>

          <option *ngFor="let est of establishments"
                  [value]="est.establecimiento_id">
            {{ est.nombre }}
          </option>

        </select>
      </div>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text"
               [(ngModel)]="service.nombre"
               name="nombre"
               required>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea [(ngModel)]="service.descripcion"
                  name="descripcion"></textarea>
      </div>

      <div class="form-group">
        <label>Duración (min)</label>
        <input type="number"
               [(ngModel)]="service.duracion"
               name="duracion"
               required>
      </div>

      <div class="form-group">
        <label>Precio</label>
        <input type="number"
               [(ngModel)]="service.precio"
               name="precio"
               required>
      </div>

      <div class="buttons">

        <button type="submit" class="save-btn">
          Guardar
        </button>

        <button type="button"
                class="cancel-btn"
                (click)="closeModal()">
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
