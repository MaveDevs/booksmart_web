<div class="success-card" *ngIf="showSuccessCard">
  Servicio actualizado correctamente
</div>

<div class="modal-backdrop" (click)="closeModal()">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>Editar Servicio</h2>

    <label>Nombre</label>
    <input type="text" [(ngModel)]="service.nombre">

    <label>Descripción</label>
    <textarea [(ngModel)]="service.descripcion"></textarea>

    <label>Duración</label>
    <input type="number" [(ngModel)]="service.duracion">

    <label>Precio</label>
    <input type="number" [(ngModel)]="service.precio">

    <div class="buttons">

      <button class="save-btn"
              (click)="updateService()">
        Guardar
      </button>

      <button class="cancel-btn"
              (click)="closeModal()">
        Cancelar
      </button>

    </div>

  </div>

</div>
