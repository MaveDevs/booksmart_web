<div class="container">

  <div class="header">
    <h2>Pagos</h2>

    <div class="header-actions">

      <input 
        type="text"
        placeholder="Buscar por suscripción, monto, método o estado..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
        class="search-input"
      />

      <button class="add-btn" (click)="openCreateModal()">
        + Nuevo Pago
      </button>

    </div>
  </div>

  <div *ngIf="loading">
    <p>Cargando pagos...</p>
  </div>

  <div *ngIf="!loading && filteredPayments.length === 0">
    <p>No se encontraron pagos</p>
  </div>

  <table *ngIf="filteredPayments.length > 0" class="table">

    <thead>
      <tr>
        <th>Suscripción</th>
        <th>Monto</th>
        <th>Método</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let p of filteredPayments">

        <td>
          {{ p.establecimiento_nombre }} - {{ p.plan_nombre }}
        </td>

        <td>${{ p.monto }}</td>
        <td>{{ p.metodo_pago }}</td>
        <td>{{ p.estado }}</td>

        <td class="actions">

          <button class="edit-btn" (click)="editPayment(p)">
            ✎
          </button>

          <button class="delete-btn"
                  (click)="openDeleteModal(p.pago_id || p.id)">
            🗑
          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>

<app-create-payment
  *ngIf="showCreateModal"
  (close)="closeCreateModal()"
  (created)="reloadAfterCreate()">
</app-create-payment>

<app-edit-payment
  *ngIf="showEditModal"
  [paymentId]="selectedId"
  (close)="closeEditModal()"
  (updated)="reloadAfterUpdate()">
</app-edit-payment>

<app-delete-payment
  *ngIf="showDeleteModal"
  [paymentId]="selectedId"
  (close)="closeDeleteModal()"
  (deleted)="reloadAfterDelete()">
</app-delete-payment>
