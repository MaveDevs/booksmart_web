<div class="modal-backdrop" (click)="closeModal()">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>Crear Reporte</h2>

    <form (ngSubmit)="createReport()">

      <div class="form-group">
        <label>Establecimiento</label>
        <select [(ngModel)]="report.establecimiento_id"
                name="establecimiento_id"
                required>

          <option value="">Seleccionar</option>

          <option *ngFor="let est of establishments"
                  [value]="est.establecimiento_id">
            {{ est.nombre }}
          </option>

        </select>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea [(ngModel)]="report.descripcion"
                  name="descripcion"
                  required></textarea>
      </div>

      <div class="buttons">

        <button type="submit" class="save-btn">
          Guardar
        </button>

        <button type="button"
                class="cancel-btn"
                (click)="closeModal()">
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
