<div class="success-card" *ngIf="showSuccessCard">
  Reporte actualizado correctamente
</div>

<div class="modal-backdrop" (click)="closeModal()">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>Editar Reporte</h2>

    <label>Descripción</label>
    <textarea [(ngModel)]="report.descripcion"></textarea>

    <div class="buttons">

      <button 
        class="save-btn"
        (click)="updateReport()">
        Guardar
      </button>

      <button 
        class="cancel-btn"
        (click)="closeModal()">
        Cancelar
      </button>

    </div>

  </div>

</div>
