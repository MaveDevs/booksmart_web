<div class="modal-backdrop" (click)="closeModal()">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>Crear Trabajador</h2>

    <form>

      <div class="form-group">
        <label>Nombre</label>
        <input [(ngModel)]="worker.nombre" name="nombre">
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <input [(ngModel)]="worker.apellido" name="apellido">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="worker.email" name="email">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input [(ngModel)]="worker.telefono" name="telefono">
      </div>

      <div class="form-group">
        <label>Foto Perfil</label>

        <input type="file" (change)="onFileSelected($event)">

        <img 
          *ngIf="photoPreview"
          [src]="photoPreview"
          style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-top:10px;"
        >
      </div>

      <div class="form-group">
        <label>Especialidad</label>
        <select [(ngModel)]="worker.especialidad" name="especialidad">
          <option value="">Selecciona</option>
          <option value="Barbero">Barbero</option>
          <option value="Estilista">Estilista</option>
          <option value="Manicurista">Manicurista</option>
          <option value="Masajista">Masajista</option>
        </select>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input [(ngModel)]="worker.descripcion" name="descripcion">
      </div>

      <div class="form-group">
        <label>Establecimiento</label>
        <select [(ngModel)]="worker.establecimiento_id" name="establecimiento">
          <option value="">Selecciona</option>

          <option *ngFor="let est of establishments" [value]="est.establecimiento_id">
            {{ est.nombre }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha contratación</label>
        <input type="date" [(ngModel)]="worker.fecha_contratacion" name="fecha">
      </div>

      <div class="form-group-inline">
        <input type="checkbox" [(ngModel)]="worker.activo" name="activo">
        <label>Activo</label>
      </div>

      <div class="buttons">
        <button type="button" class="save-btn" (click)="createWorker()">Guardar</button>
        <button type="button" class="cancel-btn" (click)="closeModal()">Cancelar</button>
      </div>

    </form>

  </div>

</div>
