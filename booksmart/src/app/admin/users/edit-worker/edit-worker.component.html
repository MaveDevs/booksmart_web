<div class="modal-backdrop">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>Editar Trabajador</h2>

    <form class="form-grid">

      <div class="form-group">
        <label>Nombre</label>
        <input [(ngModel)]="worker.nombre" name="nombre">
      </div>

      <div class="form-group">
        <label>Apellido</label>
        <input [(ngModel)]="worker.apellido" name="apellido">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="worker.email" name="email">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input [(ngModel)]="worker.telefono" name="telefono">
      </div>

      <div class="form-group full">
        <label>Foto Perfil</label>
        <input type="file" (change)="onFileSelected($event)">
      </div>

      <div class="form-group full" *ngIf="imagePreview" style="text-align:center;">
        <img 
          [src]="imagePreview"
          style="width:90px;height:90px;border-radius:50%;object-fit:cover;"
        >
      </div>

      <div class="form-group">
        <label>Especialidad</label>
        <select [(ngModel)]="worker.especialidad" name="especialidad">
          <option value="">Selecciona</option>
          <option value="Barbero">Barbero</option>
          <option value="Estilista">Estilista</option>
          <option value="Manicurista">Manicurista</option>
          <option value="Masajista">Masajista</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha contratación</label>
        <input type="date" [(ngModel)]="worker.fecha_contratacion" name="fecha">
      </div>

      <div class="form-group full">
        <label>Descripción</label>
        <textarea [(ngModel)]="worker.descripcion" name="descripcion"></textarea>
      </div>

      <div class="form-group full">
        <label>Establecimiento</label>
        <select [(ngModel)]="worker.establecimiento_id" name="establecimiento">
          <option [ngValue]="null">Selecciona</option>

          <option 
            *ngFor="let est of establishments" 
            [ngValue]="est.establecimiento_id">
            {{ est.nombre }}
          </option>
        </select>
      </div>

      <div class="form-group-inline full">
        <input 
          type="checkbox" 
          id="activo"
          [(ngModel)]="worker.activo" 
          name="activo"
        >
        <label for="activo">Activo</label>
      </div>

      <div class="buttons full">
        <button 
          type="button" 
          class="save-btn" 
          (click)="update()" 
          [disabled]="loading">
          {{ loading ? 'Guardando...' : 'Guardar' }}
        </button>

        <button 
          type="button" 
          class="cancel-btn" 
          (click)="close.emit()">
          Cancelar
        </button>
      </div>

    </form>

  </div>

</div>
