<div class="container">

  <div class="header">

    <div class="title-section">

      <h2>Usuarios</h2>

      <div class="tabs">

        <button 
          [class.active]="view === 'owners'"
          (click)="setView('owners')">
          Dueños
        </button>

        <button 
          [class.active]="view === 'clients'"
          (click)="setView('clients')">
          Clientes
        </button>

        <button 
          [class.active]="view === 'all'"
          (click)="setView('all')">
          Todos
        </button>

      </div>

    </div>

    <button class="add-btn" (click)="openCreate()">
      + Crear {{ view === 'clients' ? 'Cliente' : 'Usuario' }}
    </button>

  </div>

  <div *ngIf="loading">
    <p>Cargando usuarios...</p>
  </div>

  <table *ngIf="!loading && filteredUsers.length > 0" class="table">

    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let user of filteredUsers">

        <td>{{ user.nombre }}</td>
        <td>{{ user.apellido }}</td>
        <td>{{ user.correo }}</td>

        <td>
          {{ user.rol_id === 2 ? 'Dueño' : user.rol_id === 3 ? 'Cliente' : 'Otro' }}
        </td>

        <td>
          <span [ngClass]="user.activo ? 'status-active' : 'status-inactive'">
            {{ user.activo ? 'Activo' : 'Inactivo' }}
          </span>
        </td>

        <td>{{ user.fecha_creacion | date:'yyyy-MM-dd' }}</td>

        <td class="actions">

          <button class="edit-btn" (click)="openEdit(user.usuario_id)">
            ✎
          </button>

          <button class="delete-btn" (click)="openDelete(user.usuario_id)">
            🗑
          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>

<app-create-user *ngIf="showCreateModal"
(close)="closeCreate()"
(created)="reloadAll()"></app-create-user>

<app-edit-user *ngIf="showEditModal"
[userId]="selectedId"
(close)="closeEdit()"
(updated)="reloadAll()"></app-edit-user>

<app-delete-user *ngIf="showDeleteModal"
[userId]="selectedId"
(close)="closeDelete()"
(deleted)="reloadAll()"></app-delete-user>

<app-create-client *ngIf="showCreateClientModal"
(close)="closeCreate()"
(created)="reloadAll()"></app-create-client>

<app-edit-client *ngIf="showEditClientModal"
[clientId]="selectedId"
(close)="closeEdit()"
(updated)="reloadAll()"></app-edit-client>

<app-delete-client *ngIf="showDeleteClientModal"
[clientId]="selectedId"
(close)="closeDelete()"
(deleted)="reloadAll()"></app-delete-client>
