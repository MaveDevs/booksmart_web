<div class="modal-backdrop" (click)="closeModal()">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>Crear Plan</h2>

    <form (ngSubmit)="createPlan()">

      <div class="form-group">
        <label>Nombre</label>
        <input type="text"
               [(ngModel)]="plan.nombre"
               name="nombre"
               required>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input type="text"
               [(ngModel)]="plan.descripcion"
               name="descripcion"
               required>
      </div>

      <div class="form-group">
        <label>Precio</label>
        <input type="number"
               [(ngModel)]="plan.precio"
               name="precio"
               required>
      </div>

      <div class="buttons">

        <button type="submit" class="save-btn">
          Guardar
        </button>

        <button type="button"
                class="cancel-btn"
                (click)="closeModal()">
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
