<div class="modal-overlay" (click)="closeModal()">

  <div class="modal-card" (click)="$event.stopPropagation()">

    <h2>Crear establecimiento</h2>

    <form (ngSubmit)="createEstablishment()">

      <h3>Datos del establecimiento</h3>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="establishment.nombre" name="nombre" required>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input type="text" [(ngModel)]="establishment.descripcion" name="descripcion">
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" [(ngModel)]="establishment.direccion" name="direccion">
      </div>

      <div class="form-group">
        <label>Latitud</label>
        <input type="number" [(ngModel)]="establishment.latitud" name="latitud">
      </div>

      <div class="form-group">
        <label>Longitud</label>
        <input type="number" [(ngModel)]="establishment.longitud" name="longitud">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="establishment.telefono" name="telefono">
      </div>

      <div class="form-group">
        <label>Usuario</label>

        <select [(ngModel)]="establishment.usuario_id" name="usuario_id" required>

          <option value="">Seleccionar usuario</option>

          <option
            *ngFor="let user of users"
            [value]="user.usuario_id">

            {{ user.nombre }} {{ user.apellido }}

          </option>

        </select>
      </div>


      <h3>Datos del perfil</h3>

      <div class="form-group">
        <label>Descripción pública</label>
        <input type="text" [(ngModel)]="profile.descripcion_publica" name="descripcion_publica">
      </div>

      <div class="form-group">
        <label>Logo</label>
        <input type="text" [(ngModel)]="profile.imagen_logo" name="imagen_logo">
      </div>

      <div class="form-group">
        <label>Imagen portada</label>
        <input type="text" [(ngModel)]="profile.imagen_portada" name="imagen_portada">
      </div>


      <h3>Horario</h3>

      <div class="form-group">
        <label>Día</label>
        <select [(ngModel)]="agenda.dia_semana" name="dia_semana">
          <option value="">Seleccionar</option>
          <option>LUNES</option>
          <option>MARTES</option>
          <option>MIERCOLES</option>
          <option>JUEVES</option>
          <option>VIERNES</option>
          <option>SABADO</option>
          <option>DOMINGO</option>
        </select>
      </div>

      <div class="form-group">
        <label>Hora inicio</label>
        <input type="time" [(ngModel)]="agenda.hora_inicio" name="hora_inicio">
      </div>

      <div class="form-group">
        <label>Hora fin</label>
        <input type="time" [(ngModel)]="agenda.hora_fin" name="hora_fin">
      </div>


      <div class="buttons">

        <button type="submit" class="save-btn">
          Crear
        </button>

        <button type="button" class="cancel-btn" (click)="closeModal()">
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
