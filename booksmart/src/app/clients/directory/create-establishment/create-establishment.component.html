<div class="modal" (click)="closeModal()">

  <div class="modal-content" (click)="$event.stopPropagation()">

    <h2>Crear Establecimiento</h2>

    <form (ngSubmit)="createEstablishment()">

      <div class="grid">

        <div class="column">

          <h3>Datos</h3>

          <div class="form-group">
            <label>Nombre</label>
            <input [(ngModel)]="establishment.nombre" name="nombre" required>
          </div>

          <div class="form-group">
            <label>Descripción</label>
            <textarea [(ngModel)]="establishment.descripcion" name="descripcion"></textarea>
          </div>

          <div class="form-group">
            <label>Dirección</label>
            <input [(ngModel)]="establishment.direccion" name="direccion">
          </div>

          <div class="form-group">
            <label>Latitud</label>
            <input type="number" step="any" [(ngModel)]="establishment.latitud" name="latitud">
          </div>

          <div class="form-group">
            <label>Longitud</label>
            <input type="number" step="any" [(ngModel)]="establishment.longitud" name="longitud">
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input [(ngModel)]="establishment.telefono" name="telefono">
          </div>

          <div class="form-group">
            <label>Dueño</label>
            <select [(ngModel)]="establishment.usuario_id" name="usuario_id">
              <option value="">Selecciona</option>
              <option *ngFor="let user of users" [value]="user.usuario_id">
                {{ user.nombre }} {{ user.apellido }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label>Estado</label>

            <div class="toggle">
              <span [class.active]="establishment.activo">Activo</span>

              <label class="switch">
                <input type="checkbox"
                       [(ngModel)]="establishment.activo"
                       name="activo">
                <span class="slider"></span>
              </label>

              <span [class.inactive]="!establishment.activo">Inactivo</span>
            </div>
          </div>

        </div>

        <div class="column">

          <h3>Perfil</h3>

          <div class="form-group">
            <label>Descripción pública</label>
            <input [(ngModel)]="profile.descripcion_publica" name="descripcion_publica">
          </div>

          <div class="form-group">
            <label>Logo</label>
            <input type="file" (change)="onFileSelected($event,'logo')">
            <img *ngIf="logoPreview" [src]="logoPreview" class="image-preview">
          </div>

          <div class="form-group">
            <label>Portada</label>
            <input type="file" (change)="onFileSelected($event,'portada')">
            <img *ngIf="portadaPreview" [src]="portadaPreview" class="image-preview">
          </div>

          <h3>Horarios</h3>

          <div *ngFor="let a of agendas; let i = index" class="agenda-block">

            <div class="form-group">
              <label>Día</label>
              <select [(ngModel)]="a.dia_semana" name="dia_{{i}}">
                <option value="">Selecciona</option>
                <option>LUNES</option>
                <option>MARTES</option>
                <option>MIERCOLES</option>
                <option>JUEVES</option>
                <option>VIERNES</option>
                <option>SABADO</option>
                <option>DOMINGO</option>
              </select>
            </div>

            <div class="form-group">
              <label>Hora inicio</label>
              <input type="time" [(ngModel)]="a.hora_inicio" name="inicio_{{i}}">
            </div>

            <div class="form-group">
              <label>Hora fin</label>
              <input type="time" [(ngModel)]="a.hora_fin" name="fin_{{i}}">
            </div>

            <button type="button"
                    class="remove-btn"
                    *ngIf="agendas.length > 1"
                    (click)="removeAgenda(i)">
              🗑 Eliminar
            </button>

          </div>

          <button type="button"
                  class="add-agenda-btn"
                  (click)="addAgenda()">
            + Agregar otro día
          </button>

        </div>

      </div>

      <div class="buttons">
        <button type="submit" class="save-btn">Crear</button>
        <button type="button" class="cancel-btn" (click)="closeModal()">Cancelar</button>
      </div>

    </form>

  </div>

</div>
