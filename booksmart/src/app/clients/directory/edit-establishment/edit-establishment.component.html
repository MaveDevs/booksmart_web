<div class="modal-overlay">

  <div class="modal-card">

    <h2>Editar establecimiento</h2>

    <form (ngSubmit)="updateEstablishment()">

      <input
        type="text"
        placeholder="Nombre"
        [(ngModel)]="establishment.nombre"
        name="nombre"
        required>

      <input
        type="text"
        placeholder="Descripción"
        [(ngModel)]="establishment.descripcion"
        name="descripcion">

      <input
        type="text"
        placeholder="Dirección"
        [(ngModel)]="establishment.direccion"
        name="direccion">

      <input
        type="text"
        placeholder="Teléfono"
        [(ngModel)]="establishment.telefono"
        name="telefono">

      <div class="buttons">

        <button type="submit" class="save-btn">
          Guardar
        </button>

        <button
          type="button"
          class="cancel-btn"
          (click)="closeModal()">
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
