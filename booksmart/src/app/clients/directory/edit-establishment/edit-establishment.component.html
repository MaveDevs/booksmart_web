<div class="success-card" *ngIf="showSuccessCard">
   Establecimiento actualizado correctamente
</div>

<div class="modal-backdrop">
  <div class="modal">

    <h2>Editar Establecimiento</h2>

    <label>Nombre</label>
    <input type="text" [(ngModel)]="establishment.nombre">

    <label>Descripción</label>
    <input type="text" [(ngModel)]="establishment.descripcion">

    <label>Dirección</label>
    <input type="text" [(ngModel)]="establishment.direccion">

    <label>Teléfono</label>
    <input type="text" [(ngModel)]="establishment.telefono">

    <div class="buttons">
      <button (click)="updateEstablishment()">Guardar</button>
      <button (click)="closeModal()">Cancelar</button>
    </div>

  </div>
</div>
