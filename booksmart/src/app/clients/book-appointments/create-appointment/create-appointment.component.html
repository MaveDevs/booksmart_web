<div class="modal-overlay" (click)="closeModal()">

  <div class="create-card" (click)="$event.stopPropagation()">

    <h2>Nueva Cita</h2>

    <form (ngSubmit)="createAppointment()">

      <div class="form-group">
        <label>Cliente</label>
        <select [(ngModel)]="appointment.cliente_id" name="cliente_id" required>
          <option value="" disabled selected>Selecciona un cliente</option>
          <option *ngFor="let user of users" [value]="user.usuario_id">
            {{ user.nombre }} {{ user.apellido }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Servicio</label>
        <select [(ngModel)]="appointment.servicio_id" name="servicio_id" required>
          <option value="" disabled selected>Selecciona un servicio</option>
          <option *ngFor="let service of services" [value]="service.servicio_id">
            {{ service.nombre }} - ${{ service.precio }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha</label>
        <input type="date" [(ngModel)]="appointment.fecha" name="fecha" required>
      </div>

      <div class="form-group">
        <label>Hora inicio</label>
        <input type="time" [(ngModel)]="appointment.hora_inicio" name="hora_inicio" required>
      </div>

      <div class="form-group">
        <label>Hora fin</label>
        <input type="time" [(ngModel)]="appointment.hora_fin" name="hora_fin" required>
      </div>

      <div class="buttons">

        <button type="submit" class="btn-create">
          Crear
        </button>

        <button type="button" class="btn-cancel" (click)="closeModal()">
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
