<div class="modal-overlay">

  <div class="create-card">

    <h2>Nueva Cita</h2>

    <form (ngSubmit)="createAppointment()">

      <div class="form-group">
        <label>Cliente ID</label>
        <input
          type="number"
          [(ngModel)]="appointment.cliente_id"
          name="cliente_id"
          required>
      </div>

      <div class="form-group">
        <label>Servicio ID</label>
        <input
          type="number"
          [(ngModel)]="appointment.servicio_id"
          name="servicio_id"
          required>
      </div>

      <div class="form-group">
        <label>Fecha</label>
        <input
          type="date"
          [(ngModel)]="appointment.fecha"
          name="fecha"
          required>
      </div>

      <div class="form-group">
        <label>Hora inicio</label>
        <input
          type="time"
          [(ngModel)]="appointment.hora_inicio"
          name="hora_inicio"
          required>
      </div>

      <div class="form-group">
        <label>Hora fin</label>
        <input
          type="time"
          [(ngModel)]="appointment.hora_fin"
          name="hora_fin"
          required>
      </div>

      <div class="buttons">

        <button type="submit" class="btn-create">
          Crear
        </button>

        <button
          type="button"
          class="btn-cancel"
          (click)="closeModal()">
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
